<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vireo — a simple, fast markdown editor for macOS</title>
  <meta name="description" content="Vireo is a fast, native macOS markdown editor. It hides the syntax and shows it, dimmed, only where you're editing. Free, 4 MB, no vaults or plugins." />
  <meta property="og:title" content="Vireo — a simple, fast markdown editor for macOS" />
  <meta property="og:description" content="Every other markdown app shows you the code. Vireo shows you the words — except the one paragraph you're on." />
  <meta property="og:image" content="hero.png" />
  <style>
    :root {
      /* Dark, slightly cool neutral base — everything else derives from this */
      --bg:        #16171a;
      --bg-raised: #1c1d21;
      --text:      #b6b8bf;   /* plain body */
      --text-dim:  #7c7e86;   /* captions, footer */
      --text-hi:   #e9eaef;   /* strong text */
      --hairline:  rgba(255,255,255,0.06);

      /* Neumorphic shadow pair (light top-left, dark bottom-right) */
      --nm-light:  rgba(255,255,255,0.045);
      --nm-dark:   rgba(0,0,0,0.55);

      --maxw: 1200px;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif;
      font-size: 18px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ---------- HERO ----------
       The pitch sits where a centred --maxw container's left edge would fall,
       so the shot can reach further right than that container would allow. */
    .hero {
      display: grid;
      grid-template-columns: minmax(320px, 480px) minmax(0, 940px);
      align-items: center;
      gap: 120px;
      min-height: 100vh;
      padding: 64px 40px 64px max(24px, calc((100vw - var(--maxw)) / 2));
    }

    .pitch { text-align: left; }

    /* 96px source drawn at 48 so it stays sharp on a 2x display. */
    .appicon {
      display: block;
      width: 48px;
      height: 48px;
      margin: 0 0 20px;
    }

    /* The one neumorphic headline: subtle gradient fill + soft emboss. */
    h1 {
      margin: 0;
      font-size: clamp(34px, 4.4vw, 52px);
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #fbfbfd 0%, #cdced6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      /* faint light lift under the glyphs = gentle raised emboss, no darkening */
      text-shadow: 0 1px 1px rgba(255,255,255,0.05);
    }

    .subhead {
      margin: 22px 0 0;
      max-width: 42ch;
      font-size: 19px;
      color: var(--text-dim);
    }

    /* ---------- NEUMORPHIC BUTTON ---------- */
    .cta { margin-top: 36px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 16px 32px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-hi);
      text-decoration: none;
      cursor: pointer;
      background: linear-gradient(180deg, #24262b 0%, #191a1e 100%);
      /* raised: outer soft shadows + inner top highlight / bottom shade */
      box-shadow:
        -6px -6px 14px var(--nm-light),
         7px  7px 18px var(--nm-dark),
        inset 1px 1px 1px rgba(255,255,255,0.06),
        inset -1px -1px 2px rgba(0,0,0,0.45);
      transition: box-shadow 140ms ease, transform 140ms ease;
    }

    .btn:hover {
      box-shadow:
        -7px -7px 16px var(--nm-light),
         9px  9px 22px var(--nm-dark),
        inset 1px 1px 1px rgba(255,255,255,0.08),
        inset -1px -1px 2px rgba(0,0,0,0.45);
      transform: translateY(-1px);
    }

    /* pressed: shadows flip inward */
    .btn:active {
      transform: translateY(0);
      box-shadow:
        inset 4px 4px 10px var(--nm-dark),
        inset -4px -4px 10px var(--nm-light);
    }

    .btn svg {
      width: 17px;
      height: 17px;
      /* nudge Apple logo optically onto the baseline */
      margin-top: -2px;
      flex: none;
    }

    .cta-meta {
      margin-top: 16px;
      font-size: 14px;
      color: var(--text-dim);
    }

    /* ---------- POINTS ---------- */
    .points {
      margin: 120px 0 0;
      padding: 0;
      list-style: none;
      max-width: 40ch;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-dim);
    }
    .points li + li { margin-top: 8px; }
    .points b {
      font-weight: 600;
      color: var(--text-hi);
    }
    .points code {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.92em;
    }

    /* ---------- SCREENSHOT ---------- */
    .shot {
      padding: 0;
      border-radius: 24px;
      background: var(--bg-raised);
      box-shadow:
        -8px -8px 20px var(--nm-light),
        10px 10px 28px var(--nm-dark);
    }
    .shot img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 84vh;
      object-fit: contain;
      border-radius: 24px;
    }

    @media (max-width: 860px) {
      /* Plain block flow, not grid: a single 1fr track under
         justify-content: center sizes to the content's max-content width
         instead of stretching, which let the headline overflow unwrapped. */
      .hero {
        display: block;
        min-height: 0;
        padding: 72px 24px 48px;
      }
      .pitch { text-align: center; }
      .appicon { margin-left: auto; margin-right: auto; }
      .subhead { margin-left: auto; margin-right: auto; }
      .points { margin-left: auto; margin-right: auto; text-align: left; }
      .shot { margin-top: 40px; }
    }

    @media (max-width: 480px) {
      body { font-size: 17px; }
      .hero { padding: 56px 0 40px; }
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="pitch">
      <img class="appicon" src="icon.png" width="48" height="48" alt="" />
      <h1>A simple, fast markdown editor for macOS</h1>
      <p class="subhead">No vaults, no plugins, no subscription.</p>
      <div class="cta">
        <a class="btn" href="#"><svg viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>Download for Mac — Free</a>
        <p class="cta-meta">Native macOS · 4&nbsp;MB</p>
      </div>

      <ul class="points">
        <li><b>Local.</b> Your files stay on your computer.</li>
        <li><b>Native.</b> Built to be your default app for <code>.md</code> files.</li>
        <li><b>Polished.</b> A reading and writing experience worth the screen time.</li>
      </ul>
    </div>

    <div class="shot">
      <img src="hero.png" alt="A markdown document open in Vireo. Most of it renders clean; the paragraph under the caret shows its raw markdown, dimmed." />
    </div>
  </div>
</body>
</html>
